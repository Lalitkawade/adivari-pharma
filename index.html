    <!-- Structured Data (JSON-LD): FAQPage Schema for International Importer Queries -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do international buyers import pharmaceuticals from Adivari Pharmaceuticals India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "International buyers, distributors, and hospital purchasing directors can import directly by submitting a Request for Quotation (RFQ). We provide full regulatory support including CTD/eCTD Dossiers (Modules 1-5), Certificate of Pharmaceutical Product (COPP in WHO format), Free Sale Certificates (FSC), Certificate of Analysis (COA), and commercial proforma invoices based on CIF, FOB, or CFR Incoterms."
          }
        },
        {
          "@type": "Question",
          "name": "What international regulatory documents and dossiers does Adivari provide?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Adivari Pharmaceuticals provides complete CTD and eCTD registration dossiers (Modules 1 through 5), WHO-format COPP issued by the Indian drug authority (CDSCO), Free Sale Certificate (FSC), GMP Certificate, stability data according to ICH Climatic Zones (including Zone IVb for hot/humid regions at 30°C/75% RH), and batch-specific analytical certificates."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer contract manufacturing, private labeling, and third-party pharma manufacturing for foreign brands?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We specialize in third-party contract manufacturing and private labeling (OEM) for international pharmaceutical distributors and brand owners. We offer customized primary and secondary packaging with bilingual labeling (English, Spanish, French, Arabic, Russian), custom batch sizes, and GS1 2D DataMatrix serialization."
          }
        },
        {
          "@type": "Question",
          "name": "Which ports and Incoterms are used for global pharmaceutical shipments from India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We ship sea freight via JNPT (Nhava Sheva) Port, Mumbai (the largest container port in India) for FCL and LCL refrigerated container consignments. For urgent hospital orders and temperature-sensitive biologics, we ship express air freight via Mumbai International Airport (BOM) with cold-chain data-loggers ensuring delivery within 72-96 hours worldwide. We operate under CIF, FOB, CFR, and EXW Incoterms."
          }
        },
        {
          "@type": "Question",
          "name": "Which countries does Adivari Pharmaceuticals export to?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We export across Latin America (Mexico, Brazil, Colombia, Peru, Chile), the Middle East and Gulf GCC (UAE, Saudi Arabia, Oman, Kuwait, Qatar), Southeast Asia / ASEAN (Vietnam, Philippines, Malaysia, Thailand, Indonesia), Africa (Kenya, Nigeria, Ghana, Tanzania, Uganda), and Central Asia / CIS (Uzbekistan, Kazakhstan, Azerbaijan, Georgia)."
          }
        }
      ]
